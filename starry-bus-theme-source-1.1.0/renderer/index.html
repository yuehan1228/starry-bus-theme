<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v3" />
    <title>Starry Bus Theme</title>
    <style>
      :root {
        --bg-deep: #071525;
        --bg-card: rgba(13, 35, 58, 0.78);
        --border-glass: rgba(154, 206, 245, 0.18);
        --border-active: rgba(240, 184, 90, 0.68);
        --text-main: #eef5fb;
        --text-sub: #b8cfe3;
        --accent-blue: #4da6e8;
        --accent-gold: #f0b85a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--text-main);
        background:
          linear-gradient(180deg, rgba(6, 18, 32, 0.72) 0%, rgba(10, 29, 48, 0.84) 100%),
          url("../assets/starry-bus-bg.jpg") center/cover no-repeat fixed;
        padding: calc(var(--pi-plugin-titlebar-height, 46px) + 14px) 24px 26px;
      }
      .container {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .hero {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--border-glass);
        box-shadow: 0 18px 42px rgba(2, 8, 16, 0.55);
        min-height: 196px;
        display: flex;
        align-items: flex-end;
        padding: 20px 22px;
        background:
          linear-gradient(180deg, rgba(6, 18, 32, 0.12) 0%, rgba(6, 18, 32, 0.84) 100%),
          url("../assets/starry-bus-bg.jpg") center 58% / cover no-repeat;
      }
      .hero-content {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        padding: 4px 11px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        background: rgba(77, 166, 232, 0.25);
        border: 1px solid rgba(130, 196, 248, 0.38);
        backdrop-filter: blur(8px);
        color: #dff0ff;
      }
      .hero h1 {
        margin: 0;
        font-size: 23px;
        letter-spacing: -0.02em;
      }
      .hero p {
        margin: 0;
        font-size: 13.5px;
        color: var(--text-sub);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 680px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--bg-card);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border-glass);
        border-radius: 14px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 11px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .card[data-active="true"] {
        border-color: var(--border-active);
        box-shadow: 0 0 0 1px var(--border-active), 0 12px 28px rgba(2, 8, 16, 0.45);
      }
      .card h2 {
        margin: 0;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .tag {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #f0b85a;
      }
      .card p {
        margin: 0;
        font-size: 12.5px;
        color: var(--text-sub);
        line-height: 1.5;
        flex: 1;
      }
      button.btn {
        cursor: pointer;
        border: 1px solid rgba(130, 196, 248, 0.35);
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #061524;
        background: linear-gradient(135deg, #65b8f2 0%, #f0b85a 100%);
        transition: transform 0.12s ease, opacity 0.12s ease;
      }
      button.btn.secondary {
        color: var(--text-main);
        background: rgba(77, 166, 232, 0.18);
      }
      button.btn:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }
      .status-bar {
        font-size: 12.5px;
        color: var(--text-sub);
        text-align: center;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="hero">
        <div class="hero-content">
          <span class="badge" id="active-badge"></span>
          <h1 data-i18n="heroTitle"></h1>
          <p data-i18n="heroSubtitle"></p>
        </div>
      </div>

      <div class="grid">
        <div class="card" id="card-auto">
          <h2>
            <span data-i18n="autoTitle"></span>
            <span class="tag" data-i18n="autoTag"></span>
          </h2>
          <p data-i18n="autoDesc"></p>
          <button class="btn" id="btn-auto" data-i18n="autoBtn"></button>
        </div>

        <div class="card" id="card-night">
          <h2>
            <span data-i18n="nightTitle"></span>
            <span class="tag" data-i18n="nightTag"></span>
          </h2>
          <p data-i18n="nightDesc"></p>
          <button class="btn secondary" id="btn-night" data-i18n="nightBtn"></button>
        </div>

        <div class="card" id="card-day">
          <h2>
            <span data-i18n="dayTitle"></span>
            <span class="tag" data-i18n="dayTag"></span>
          </h2>
          <p data-i18n="dayDesc"></p>
          <button class="btn secondary" id="btn-day" data-i18n="dayBtn"></button>
        </div>
      </div>

      <div class="status-bar" id="status-bar"></div>
    </div>

    <script>
      const COPY = {
        en: {
          heroTitle: "Starry Bus Theme",
          heroSubtitle: "Inspired by the starry sky, cumulonimbus clouds, retro bus, and sunlit meadow illustration.",
          autoTitle: "Follow System",
          autoTag: "Auto",
          autoDesc: "Automatically switches between Starry Bus Night (Dark) and Starry Bus Day (Light) based on your OS theme.",
          autoBtn: "Follow System Theme",
          nightTitle: "Starry Bus Night",
          nightTag: "Dark",
          nightDesc: "Deep starry indigo canvas with cloud-white typography, retro bus blue accents, and warm meadow gold focus rings.",
          nightBtn: "Pin Night Theme",
          dayTitle: "Starry Bus Day",
          dayTag: "Light",
          dayDesc: "Bright cumulonimbus cloud white and sky blue surfaces with high-contrast deep ocean ink and frosted glass.",
          dayBtn: "Pin Day Theme",
          statusAuto: "Active mode: Follow System (OS is currently {scheme})",
          statusNight: "Active mode: Pinned to Starry Bus Night (Dark)",
          statusDay: "Active mode: Pinned to Starry Bus Day (Light)",
          schemeDark: "Dark / Night",
          schemeLight: "Light / Day",
          footerHint: "System light/dark changes are detected automatically every few seconds while Follow System is active.",
          toastSwitched: "Theme mode updated: {mode}"
        },
        "zh-CN": {
          heroTitle: "星夜巴士 · Starry Bus Theme",
          heroSubtitle: "灵感源自星夜流云、复古大众小巴士与阳光草坡插画，支持跟随系统深浅色自动切换。",
          autoTitle: "跟随系统深浅色",
          autoTag: "自动",
          autoDesc: "实时检测操作系统深色/浅色模式，在系统为深色时自动切换为「夜空版」，系统为浅色时自动切换为「云昼版」。",
          autoBtn: "开启跟随系统",
          nightTitle: "星夜巴士 · 夜空版",
          nightTag: "深色",
          nightDesc: "以深邃夜空靛蓝与松林墨绿为底，搭配流云亮白正文、复古巴士天蓝强调色与草坡暖金焦点光晕。",
          nightBtn: "固定夜空版",
          dayTitle: "星夜巴士 · 云昼版",
          dayTag: "浅色",
          dayDesc: "提取画面中央巨型积雨云的明亮日光白与天光浅蓝，搭配深海蓝高对比正文与清爽毛玻璃侧栏。",
          dayBtn: "固定云昼版",
          statusAuto: "当前模式：跟随系统自动切换（系统当前为 {scheme}）",
          statusNight: "当前模式：已固定为「星夜巴士 · 夜空版 (Dark)」",
          statusDay: "当前模式：已固定为「星夜巴士 · 云昼版 (Light)」",
          schemeDark: "深色 · 夜空版",
          schemeLight: "浅色 · 云昼版",
          footerHint: "开启「跟随系统」后，切换操作系统的深色/浅色模式将自动同步至客户端。",
          toastSwitched: "已切换主题模式：{mode}"
        }
      };

      let currentLocale = "zh-CN";
      function t(key, vars = {}) {
        const table = COPY[currentLocale] || COPY.en;
        let text = table[key] || COPY.en[key] || key;
        for (const [k, v] of Object.entries(vars)) {
          text = text.replace(`{${k}}`, String(v));
        }
        return text;
      }

      function renderStaticCopy() {
        document.documentElement.lang = currentLocale;
        document.title = t("heroTitle");
        for (const el of document.querySelectorAll("[data-i18n]")) {
          const key = el.getAttribute("data-i18n");
          if (key) el.textContent = t(key);
        }
        document.getElementById("status-bar").textContent = t("footerHint");
      }

      function updateActiveCards(mode, systemScheme) {
        document.getElementById("card-auto").dataset.active = String(mode === "auto");
        document.getElementById("card-night").dataset.active = String(mode === "night");
        document.getElementById("card-day").dataset.active = String(mode === "day");

        const badge = document.getElementById("active-badge");
        const schemeLabel = systemScheme === "light" ? t("schemeLight") : t("schemeDark");
        if (mode === "night") {
          badge.textContent = t("statusNight");
        } else if (mode === "day") {
          badge.textContent = t("statusDay");
        } else {
          badge.textContent = t("statusAuto", { scheme: schemeLabel });
        }
      }

      async function refreshState() {
        try {
          const app = await window.pluginBridge.invoke("app.getAppearance");
          if (app?.locale && String(app.locale).toLowerCase().startsWith("en")) {
            currentLocale = "en";
          } else {
            currentLocale = "zh-CN";
          }
          renderStaticCopy();

          const st = await window.pluginBridge.invoke("theme.status");
          updateActiveCards(st?.mode || "auto", st?.systemScheme || "dark");
        } catch {
          renderStaticCopy();
          updateActiveCards("auto", "dark");
        }
      }

      async function selectMode(mode) {
        try {
          const st = await window.pluginBridge.invoke("theme.setMode", { mode });
          updateActiveCards(st?.mode || mode, st?.systemScheme || "dark");
          const label =
            mode === "night"
              ? t("nightTitle")
              : mode === "day"
                ? t("dayTitle")
                : t("autoTitle");
          await window.pluginBridge.invoke("ui.showToast", {
            message: t("toastSwitched", { mode: label })
          });
        } catch (err) {
          document.getElementById("status-bar").textContent = String(err?.message || err);
        }
      }

      document.getElementById("btn-auto").addEventListener("click", () => selectMode("auto"));
      document.getElementById("btn-night").addEventListener("click", () => selectMode("night"));
      document.getElementById("btn-day").addEventListener("click", () => selectMode("day"));
      window.pluginBridge?.on("appearance:changed", () => {
        void refreshState();
      });

      void refreshState();
    </script>
  </body>
</html>
